server:
  port: ${SPRING_PORT:8080}
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT_SECONDS:1800}
      cookie:
        secure: true
        same-site: strict
  tomcat:
    max-connections: ${TOMCAT_MAX_CONNECTIONS:20000}
    threads:
      max: ${TOMCAT_MAX_THREADS:600}
      min-spare: ${TOMCAT_MIN_SPARE_THREADS:100}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:8}
      minimum-idle: ${HIKARI_MIN_IDLE:8}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:3000}
      validation-timeout: ${HIKARI_VALIDATION_TIMEOUT:3000}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:300000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:600000}
      keepalive-time: ${HIKARI_KEEPALIVE_TIME:60000}
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:10MB}
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    properties:
      hibernate:
        show_sql: false
        format_sql: false
        highlight_sql: false
        use_sql_comments: false
  threads:
    virtual:
      enabled: ${VIRTUAL_THREADS_ENABLED:true}
  task:
    execution:
      pool:
        core-size: ${ASYNC_CORE_POOL_SIZE:5}
        max-size: ${ASYNC_MAX_POOL_SIZE:5}
        queue-capacity: ${ASYNC_QUEUE_CAPACITY:100}
  devtools:
    restart:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  config: classpath:logback/logback-${spring.profiles.active:local}.xml
  file:
    name: ${LOG_FILE_PATH:./logs/app.log}

travelx:
  ai:
    server-url: ${AI_SERVER_URL:http://localhost:8000}
  exchange-rate:
    key: ${EXCHANGERATE_API_KEY}
    url: ${EXCHANGERATE_API_URL}
  reservation:
    # discussion#16 결제 대기(PENDING_PAYMENT) 홀드 TTL — 이 안에 결제 승인이 안 오면 EXPIRED.
    payment-hold-minutes: ${RESERVATION_PAYMENT_HOLD_MINUTES:5}
    # 결제 승인 후 픽업 마감까지의 홀드 TTL.
    pickup-hold-hours: ${RESERVATION_PICKUP_HOLD_HOURS:2}
    # ReservationExpirySweeper가 위 두 TTL 만료 건을 정리하러 도는 주기(ms).
    expiry-sweep-interval-ms: ${RESERVATION_EXPIRY_SWEEP_INTERVAL_MS:60000}
    # TimeSlotInventoryReconciler를 몇 스윕 틱마다 호출할지 — 기본 5틱(60s*5≈5분).
    inventory-reconcile-every-n-ticks: ${RESERVATION_INVENTORY_RECONCILE_EVERY_N_TICKS:5}
  notify:
    # 재고 정합성 위반(InventoryConsistencyViolationException) 발생 시 알림 보낼 Discord 웹훅.
    # 미설정 시 DiscordNotifier가 조용히 스킵한다.
    discord-webhook-url: ${DISCORD_WEBHOOK_URL:}
  jwt:
    access-token-expire-minutes: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:30}
    refresh-token-expire-days: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:14}
  currency:
    sync-cron: "${CURRENCY_SYNC_CRON:0 0 0 * * *}"


springdoc:
  packages-to-scan: com.fptis.intern.server
  default-consumes-media-type: application/json;charset=UTF-8
  default-produces-media-type: application/json;charset=UTF-8
  cache:
    disabled: true
  api-docs:
    path: /api-docs/json
    groups:
      enabled: true
  swagger-ui:
    enabled: true
    path: /swagger
    tags-sorter: alpha
    operations-sorter: alpha