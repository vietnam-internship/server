services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: travelx
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    # server 컨테이너는 내부 네트워크로 db:3306에 붙지만, 호스트에서 직접(IDE 등으로) 앱을 띄워
    # DB만 도커로 쓰는 경우도 있어 호스트에도 열어둔다. 로컬에 MySQL(3306)이 떠 있는 경우가 많아
    # 기본 호스트 포트는 3307로 두고, DB_HOST_PORT로 오버라이드 가능하게 한다.
    ports:
      - "${DB_HOST_PORT:-3307}:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build: .
    # opro 프로젝트(3000/8080/8000/8001/5432)와 로컬 MySQL(3306/33060)이 쓰는 포트를 피해 기본값을 8090으로 둔다.
    ports:
      - "${SERVER_HOST_PORT:-8090}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:mysql://db:3306/travelx
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
